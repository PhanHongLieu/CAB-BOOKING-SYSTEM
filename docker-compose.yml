services:
  # MongoDB Databases - Database per Service Pattern
  mongodb-auth:
    image: mongo:7.0
    container_name: cab-mongodb-auth
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: auth_db
    volumes:
      - mongodb_auth_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-booking:
    image: mongo:7.0
    container_name: cab-mongodb-booking
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: booking_db
    volumes:
      - mongodb_booking_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-driver:
    image: mongo:7.0
    container_name: cab-mongodb-driver
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: driver_db
    volumes:
      - mongodb_driver_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    container_name: cab-postgres-payment
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: payment_db
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-notification:
    image: mongo:7.0
    container_name: cab-mongodb-notification
    ports:
      - "27022:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - mongodb_notification_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-pricing:
    image: mongo:7.0
    container_name: cab-mongodb-pricing
    ports:
      - "27023:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: pricing_db
    volumes:
      - mongodb_pricing_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-user:
    image: mongo:7.0
    container_name: cab-mongodb-user
    ports:
      - "27024:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: user_db
    volumes:
      - mongodb_user_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-review:
    image: mongo:7.0
    container_name: cab-mongodb-review
    ports:
      - "27025:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: review_db
    volumes:
      - mongodb_review_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-ride:
    image: mongo:7.0
    container_name: cab-mongodb-ride
    ports:
      - "27026:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: ride_db
    volumes:
      - mongodb_ride_data:/data/db
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Event Bus
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: cab-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cab-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: cab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cab-network
    restart: unless-stopped

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: cab-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - cab-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cab-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "6832:6832/udp"
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    networks:
      - cab-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: cab-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - SERVICE_NAME=auth-service
      - MONGODB_URI=mongodb://admin:admin123@mongodb-auth:27017/auth_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      mongodb-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-network
    restart: unless-stopped

  # Booking Service
  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: cab-booking-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - SERVICE_NAME=booking-service
      - MONGODB_URI=mongodb://admin:admin123@mongodb-booking:27017/booking_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - AUTH_SERVICE_URL=http://auth-service:3001
      - DRIVER_SERVICE_URL=http://driver-service:3003
      - LOCATION_SERVICE_URL=http://location-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - mongodb-booking
      - redis
      - rabbitmq
      - auth-service
    networks:
      - cab-network
    restart: unless-stopped

  # Driver Service
  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: cab-driver-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - SERVICE_NAME=driver-service
      - MONGODB_URI=mongodb://admin:admin123@mongodb-driver:27017/driver_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - AUTH_SERVICE_URL=http://auth-service:3001
      - LOCATION_SERVICE_URL=http://location-service:3006
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - mongodb-driver
      - redis
      - rabbitmq
      - auth-service
    networks:
      - cab-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: cab-payment-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - SERVICE_NAME=payment-service
      - DATABASE_URL=postgresql://admin:admin123@postgres-payment:5432/payment_db
      - DB_HOST=postgres-payment
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - DB_NAME=payment_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - AUTH_SERVICE_URL=http://auth-service:3001
      - BOOKING_SERVICE_URL=http://booking-service:3002
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - cab-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: cab-notification-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - SERVICE_NAME=notification-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=mongodb://admin:admin123@mongodb-notification:27017/notification_db?authSource=admin
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - redis
      - mongodb-notification
      - rabbitmq
    networks:
      - cab-network
    restart: unless-stopped

  # Location Service
  location-service:
    build:
      context: ./services/location-service
      dockerfile: Dockerfile
    container_name: cab-location-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - SERVICE_NAME=location-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - redis
      - rabbitmq
    networks:
      - cab-network
    restart: unless-stopped

  # Pricing Service
  pricing-service:
    build:
      context: ./services/pricing-service
      dockerfile: Dockerfile
    container_name: cab-pricing-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - SERVICE_NAME=pricing-service
      - MONGODB_URI=mongodb://admin:admin123@mongodb-pricing:27017/pricing_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - AUTH_SERVICE_URL=http://auth-service:3001
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - mongodb-pricing
      - redis
      - rabbitmq
      - auth-service
    networks:
      - cab-network
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: cab-user-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - PORT=3008
      - SERVICE_NAME=user-service
      - MONGODB_URI=mongodb://admin:admin123@mongodb-user:27017/user_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - AUTH_SERVICE_URL=http://auth-service:3001
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - mongodb-user
      - redis
      - rabbitmq
      - auth-service
    networks:
      - cab-network
    restart: unless-stopped

  # Review Service
  review-service:
    build:
      context: ./services/review-service
      dockerfile: Dockerfile
    container_name: cab-review-service
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=development
      - PORT=3009
      - SERVICE_NAME=review-service
      - MONGODB_URI=mongodb://admin:admin123@mongodb-review:27017/review_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - AUTH_SERVICE_URL=http://auth-service:3001
      - RIDE_SERVICE_URL=http://ride-service:3010
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - mongodb-review
      - redis
      - rabbitmq
      - auth-service
      - ride-service
    networks:
      - cab-network
    restart: unless-stopped

  # Ride Service
  ride-service:
    build:
      context: ./services/ride-service
      dockerfile: Dockerfile
    container_name: cab-ride-service
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - SERVICE_NAME=ride-service
      - MONGODB_URI=mongodb://admin:admin123@mongodb-ride:27017/ride_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - EVENT_EXCHANGE=cab_booking_events
      - AUTH_SERVICE_URL=http://auth-service:3001
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      - mongodb-ride
      - redis
      - rabbitmq
      - auth-service
    networks:
      - cab-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: cab-api-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - BOOKING_SERVICE_URL=http://booking-service:3002
      - DRIVER_SERVICE_URL=http://driver-service:3003
      - PAYMENT_SERVICE_URL=http://payment-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - LOCATION_SERVICE_URL=http://location-service:3006
      - REVIEW_SERVICE_URL=http://review-service:3007
    depends_on:
      - auth-service
      - booking-service
      - driver-service
      - payment-service
      - notification-service
      - location-service
      - pricing-service
      - user-service
      - review-service
      - ride-service
    networks:
      - cab-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cab-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    depends_on:
      - api-gateway
    networks:
      - cab-network
    restart: unless-stopped

volumes:
  mongodb_auth_data:
  mongodb_booking_data:
  mongodb_driver_data:
  postgres_payment_data:
  mongodb_notification_data:
  mongodb_pricing_data:
  mongodb_user_data:
  mongodb_review_data:
  mongodb_ride_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  postgres_review_data:

networks:
  cab-network:
    driver: bridge
