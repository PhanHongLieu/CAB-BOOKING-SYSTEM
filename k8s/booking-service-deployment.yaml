apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: cab-booking-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
      - name: booking-service
        image: cab-booking/booking-service:latest
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3002"
        - name: MONGODB_URI
          value: "mongodb://admin:$(MONGODB_PASSWORD)@mongodb:27017/cab_booking?authSource=admin"
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: password
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        - name: DRIVER_SERVICE_URL
          value: "http://driver-service:3003"
        - name: LOCATION_SERVICE_URL
          value: "http://location-service:3006"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:3005"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: cab-booking-system
spec:
  selector:
    app: booking-service
  ports:
  - port: 3002
    targetPort: 3002
